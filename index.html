<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoData Fetcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

    <style>
        @keyframes eat-cookie {
            0%   { transform: translateX(30px) rotate(0deg); opacity: 0; }
            20%  { transform: translateX(20px) rotate(45deg); opacity: 1; }
            75%  { transform: translateX(0px) rotate(180deg); opacity: 1; }
            100% { transform: translateX(-15px) rotate(225deg) scale(0.2); opacity: 0; }
        }
        @keyframes bear-chomp {
            0%, 70% { transform: scale(1); }
            85%     { transform: scale(1.15) translateY(-3px) rotate(-5deg); }
            100%    { transform: scale(1); }
        }
        .animate-cookie { animation: eat-cookie 1.5s infinite ease-in; display: inline-block; position: absolute; margin-left: 2rem; }
        .animate-bear { animation: bear-chomp 1.5s infinite; display: inline-block; position: relative; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-6">
        <h1 class="text-2xl font-bold text-center mb-2 text-blue-600">GeoData Fetcher</h1>
        <p id="subtitle" class="text-sm text-gray-500 text-center mb-6">Streams geospatial datasets straight into your browser.</p>

        <div class="mb-4">
            <label for="dataset" class="block text-sm font-medium text-gray-700 mb-2">Select Dataset</label>
            <select id="dataset" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white">
                <option value="wsf2015">World Settlement Footprint (WSF) 2015 — DLR</option>
                <option value="wsf2019">World Settlement Footprint (WSF) 2019 — DLR</option>
                <option value="tessera">TESSERA v1.1 (dclimate) - Embeddings</option>
                <option value="ghsl_built">GHSL Built-up Surface (GHS-BUILT-S) — JRC WCS</option>
            </select>
        </div>

        <!-- Dataset-specific dynamic controls injected by each plugin module -->
        <div id="extra-controls" class="mb-6"></div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Upload GeoPackage</label>
            <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="document.getElementById('fileInput').click()">
                <p class="text-sm text-gray-600"><span class="font-semibold text-blue-600">Click to upload</span> or drag and drop</p>
                <p class="text-xs text-gray-500 mt-1">Only .gpkg files accepted. Area must be smaller than 5 km × 5 km (25 km²).</p>
                <input type="file" id="fileInput" class="hidden" accept=".gpkg">
            </div>
            <div id="file-info" class="hidden mt-3 text-sm text-green-600 bg-green-50 p-2 rounded-lg border border-green-200"></div>
        </div>

        <button id="runBtn" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed hidden">
            Run Downloader
        </button>

        <div id="loading-indicator" class="mt-4 text-center block">
            <div class="text-5xl flex justify-center items-center mb-3 h-16">
                <span class="animate-bear">🐻</span>
                <span class="animate-cookie">🍪</span>
            </div>
            <p id="loading-text" class="text-sm font-medium text-blue-600 animate-pulse">Waking up the Python Bear...</p>
        </div>

        <div id="status" class="mt-4 text-center text-sm font-medium hidden"></div>

        <details class="mt-4">
            <summary class="text-xs text-gray-500 cursor-pointer">Debug log</summary>
            <pre id="log" class="mt-2 text-xs bg-gray-100 p-2 rounded-lg overflow-auto max-h-64 whitespace-pre-wrap"></pre>
        </details>
    </div>

    <script type="module">
        import { tesseraPlugin } from "./scripts/web/fetch_tessera.js";
        import { wsf2015Plugin } from "./scripts/web/download_wsf2015.js";
        import { wsf2019Plugin } from "./scripts/web/download_wsf2019.js";
        import { ghslBuiltPlugin } from "./scripts/web/download_ghsl_built.js";

        const MAX_AREA_KM2 = 25;

        const PLUGINS = {
            wsf2015: wsf2015Plugin,
            wsf2019: wsf2019Plugin,
            tessera: tesseraPlugin,
            ghsl_built: ghslBuiltPlugin
        };

        const datasetSelect = document.getElementById("dataset");
        const extraControls = document.getElementById("extra-controls");
        const subtitle = document.getElementById("subtitle");
        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const fileInfo = document.getElementById("file-info");
        const runBtn = document.getElementById("runBtn");
        const statusDiv = document.getElementById("status");
        const loadingIndicator = document.getElementById("loading-indicator");
        const loadingText = document.getElementById("loading-text");
        const logEl = document.getElementById("log");

        let selectedFile = null;
        let pyodide = null;

        const log = (...a) => {
            console.log(...a);
            logEl.textContent += a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n";
        };

        // Shared Python AOI reader & GeoTIFF/ZIP writer used by all dataset plugins
        const PY_COMMON = `
import json, zipfile, numpy as np, geopandas as gpd
from shapely.geometry import box
import tifffile

outputs = []

def reset_outputs():
    global outputs
    outputs = []

def read_bounds(fn):
    gdf = gpd.read_file(fn)
    if gdf.crs is None:
        gdf = gdf.set_crs("EPSG:4326")
    gdf = gdf.to_crs("EPSG:4326")
    b = [float(v) for v in gdf.total_bounds]
    bb = gpd.GeoSeries([box(*b)], crs="EPSG:4326")
    area_km2 = float(bb.area.iloc[0]) / 1e6
    return json.dumps({"bounds": b, "area_km2": area_km2})

def bounds_in_crs(minx, miny, maxx, maxy, crs):
    s = gpd.GeoSeries([box(minx, miny, maxx, maxy)], crs="EPSG:4326").to_crs(crs)
    return json.dumps([float(v) for v in s.total_bounds])

def write_geotiff_2d(fn, shape, dtype_str, epsg, x0, y0, sx, sy, nodata_val):
    arr = np.frombuffer(_raster_buf.to_bytes(), dtype=np.dtype(dtype_str)).reshape(json.loads(shape))
    arr = np.ascontiguousarray(arr)
    is_projected = (epsg != 4326)
    geokeys = (
        1, 1, 0, 4,
        1024, 0, 1, 1 if is_projected else 2,
        1025, 0, 1, 1,
        3072 if is_projected else 2048, 0, 1, int(epsg),
        3076 if is_projected else 2054, 0, 1, 9001 if is_projected else 9102,
    )
    extratags = [
        (33550, "d", 3, (float(sx), float(sy), 0.0), True),
        (33922, "d", 6, (0.0, 0.0, 0.0, float(x0), float(y0), 0.0), True),
        (34735, "H", len(geokeys), geokeys, True),
    ]
    if nodata_val is not None:
        extratags.append((42113, "s", 0, str(nodata_val), True))

    kw = dict(photometric="minisblack", extratags=extratags)
    try:
        tifffile.imwrite(fn, arr, compression="zlib", **kw)
    except Exception as ex:
        print("zlib compression failed (%s); writing uncompressed" % ex)
        tifffile.imwrite(fn, arr, **kw)
    outputs.append(fn)
    print("Saved %s (%dx%d px, EPSG:%d)" % (fn, arr.shape[1], arr.shape[0], epsg))

def package_outputs(zip_name="geodata_bundle.zip"):
    if len(outputs) == 1:
        return outputs[0]
    with zipfile.ZipFile(zip_name, "w") as z:
        for fn in outputs:
            z.write(fn)
    return zip_name
`;

        function renderActivePluginUI() {
            const plugin = PLUGINS[datasetSelect.value];
            subtitle.textContent = plugin.description;
            extraControls.innerHTML = plugin.controlsHTML || "";
        }

        datasetSelect.addEventListener("change", renderActivePluginUI);
        renderActivePluginUI();

        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                loadingText.innerText = "Feeding GeoPandas to the Bear (this takes a moment)...";
                await pyodide.loadPackage(["geopandas", "micropip"]);
                await pyodide.runPythonAsync("import micropip\nawait micropip.install('tifffile==2024.8.30')");
                pyodide.runPython(PY_COMMON);

                for (const plugin of Object.values(PLUGINS)) {
                    if (plugin.init) await plugin.init(pyodide);
                }

                loadingIndicator.classList.add("hidden");
                runBtn.classList.remove("hidden");
                runBtn.disabled = !selectedFile;
            } catch (err) {
                console.error(err);
                log("INIT ERROR:", String(err));
                loadingIndicator.classList.add("hidden");
                statusDiv.innerHTML = "❌ The Bear got sick. Failed to load Python.";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-600 block";
            }
        }
        initPyodide();

        // Drag & drop + file input wiring
        ["dragenter", "dragover", "dragleave", "drop"].forEach(ev => {
            dropzone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
            document.body.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropzone.addEventListener("drop", (e) => handleFile(e.dataTransfer.files));
        fileInput.addEventListener("change", (e) => handleFile(e.target.files));

        function handleFile(files) {
            if (files.length > 0 && files[0].name.toLowerCase().endsWith(".gpkg")) {
                selectedFile = files[0];
                fileInfo.innerHTML = `Ready: <strong>${selectedFile.name}</strong>`;
                fileInfo.classList.remove("hidden");
                if (pyodide) runBtn.disabled = false;
                statusDiv.classList.add("hidden");
            } else {
                alert("Please upload a valid .gpkg file.");
            }
        }

        runBtn.addEventListener("click", async () => {
            if (!selectedFile || !pyodide) return;

            const plugin = PLUGINS[datasetSelect.value];
            runBtn.classList.add("hidden");
            loadingIndicator.classList.remove("hidden");
            statusDiv.classList.add("hidden");
            loadingText.innerText = "Bear is reading your GeoPackage...";
            logEl.textContent = "";

            try {
                pyodide.globals.get("reset_outputs")();

                const buf = await selectedFile.arrayBuffer();
                pyodide.FS.writeFile(selectedFile.name, new Uint8Array(buf));
                const info = JSON.parse(pyodide.globals.get("read_bounds")(selectedFile.name));
                const bounds = info.bounds;
                log("lon/lat bounds:", bounds, `bbox area: ${info.area_km2.toFixed(3)} km²`);

                if (info.area_km2 > MAX_AREA_KM2) {
                    throw new Error(
                        `Area is too big (${info.area_km2.toFixed(2)} km²). Please upload an area smaller than 5 km × 5 km (${MAX_AREA_KM2} km²).`
                    );
                }

                if (typeof plugin.init === "function") {
                    await plugin.init(pyodide);
                }

                const written = await plugin.run({
                    pyodide,
                    bounds,
                    log,
                    setStatus: (msg) => { loadingText.innerText = msg; },
                });

                if (!written || written === 0) {
                    throw new Error("No data overlapped your area (ocean, or outside coverage).");
                }

                const fileName = pyodide.globals.get("package_outputs")(plugin.bundleName || "geodata_bundle.zip");
                const content = pyodide.FS.readFile(fileName);
                const mime = fileName.endsWith(".zip") ? "application/zip" : "image/tiff";
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                loadingIndicator.classList.add("hidden");
                runBtn.classList.remove("hidden");
                statusDiv.innerHTML = `✅ <strong>Success!</strong> Downloaded ${fileName} (${written} tile${written > 1 ? "s" : ""})`;
                statusDiv.className = "mt-4 p-3 rounded-lg text-center text-sm font-medium text-green-700 bg-green-50 border border-green-200 block";
            } catch (error) {
                console.error(error);
                log("ERROR:", String((error && error.stack) || error));
                loadingIndicator.classList.add("hidden");
                runBtn.classList.remove("hidden");
                statusDiv.innerHTML = "❌ " + String(error.message || error) + " <br><span class='text-xs'>(see debug log)</span>";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-600 block";
            } finally {
                runBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
